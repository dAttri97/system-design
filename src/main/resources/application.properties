spring.application.name=system-design
server.port=8080

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

management.endpoints.web.exposure.include=health,metrics,prometheus

# Rate limiter (Phase 1 MVP)
rate-limiter.enabled=true
rate-limiter.store.type=memory
rate-limiter.on-store-failure=fail_open
rate-limiter.rules.path=classpath:rate-limiter/rules.yml
rate-limiter.rules.reload-interval=30s

# Consistent hash ring (Chapter 6 MVP)
consistent-hash.enabled=true
consistent-hash.virtual-nodes-per-server=150
consistent-hash.nodes.path=classpath:consistent-hash/nodes.yml

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false

# Bitly URL shortener
bitly.enabled=true
bitly.base-url=http://localhost:8080
bitly.store.type=memory
bitly.cache.type=memory
bitly.cache.max-size=10000
bitly.cleanup.enabled=true
bitly.cleanup.interval-ms=3600000
