spring.application.name=system-design
server.port=8080

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

management.endpoints.web.exposure.include=health,metrics,prometheus

# Rate limiter (Phase 1 MVP)
rate-limiter.enabled=true
rate-limiter.store.type=memory
rate-limiter.on-store-failure=fail_open
rate-limiter.rules.path=classpath:rate-limiter/rules.yml
rate-limiter.rules.reload-interval=30s

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.repositories.enabled=false
