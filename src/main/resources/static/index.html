<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Short.ly — URL Shortener</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --border: #e2e8f0;
      --error: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f8fafc;
        --muted: #94a3b8;
        --border: #334155;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08);
    }
    h1 { margin: 0 0 0.25rem; font-size: 1.75rem; }
    .subtitle { color: var(--muted); margin: 0 0 1.5rem; }
    label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 0.35rem; }
    input {
      width: 100%;
      padding: 0.75rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      background: transparent;
      color: inherit;
      margin-bottom: 1rem;
    }
    details { margin-bottom: 1rem; }
    summary { cursor: pointer; color: var(--muted); font-size: 0.9rem; }
    button {
      width: 100%;
      padding: 0.85rem;
      border: none;
      border-radius: 10px;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: not-allowed; }
    .result {
      margin-top: 1.25rem;
      padding: 1rem;
      border-radius: 10px;
      background: rgba(37, 99, 235, 0.08);
      border: 1px solid rgba(37, 99, 235, 0.2);
      display: none;
    }
    .result.visible { display: block; }
    .result a { color: var(--accent); word-break: break-all; }
    .copy-row { display: flex; gap: 0.5rem; margin-top: 0.75rem; }
    .copy-row button { width: auto; padding: 0.5rem 1rem; font-size: 0.875rem; }
    .error {
      margin-top: 1rem;
      color: var(--error);
      font-size: 0.9rem;
      display: none;
    }
    .error.visible { display: block; }
  </style>
</head>
<body>
  <main>
    <h1>Short.ly</h1>
    <p class="subtitle">Paste a long URL and get a short link instantly. No signup required.</p>

    <form id="shorten-form">
      <label for="long-url">Long URL</label>
      <input id="long-url" type="url" placeholder="https://www.example.com/very/long/url" required>

      <details>
        <summary>Advanced options</summary>
        <label for="custom-alias" style="margin-top: 0.75rem;">Custom alias (optional)</label>
        <input id="custom-alias" type="text" placeholder="my-launch" pattern="[a-zA-Z0-9_-]{3,50}">

        <label for="expiration-date">Expiration (optional)</label>
        <input id="expiration-date" type="datetime-local">
      </details>

      <button type="submit" id="submit-btn">Shorten URL</button>
    </form>

    <p class="error" id="error"></p>

    <div class="result" id="result">
      <strong>Your short link</strong>
      <div class="copy-row">
        <a id="short-url" href="#" target="_blank" rel="noopener"></a>
        <button type="button" id="copy-btn">Copy</button>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById('shorten-form');
    const errorEl = document.getElementById('error');
    const resultEl = document.getElementById('result');
    const shortUrlEl = document.getElementById('short-url');
    const submitBtn = document.getElementById('submit-btn');
    const copyBtn = document.getElementById('copy-btn');

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.classList.remove('visible');
      resultEl.classList.remove('visible');
      submitBtn.disabled = true;

      const payload = {
        long_url: document.getElementById('long-url').value.trim()
      };

      const alias = document.getElementById('custom-alias').value.trim();
      if (alias) payload.custom_alias = alias;

      const expiration = document.getElementById('expiration-date').value;
      if (expiration) payload.expiration_date = new Date(expiration).toISOString();

      try {
        const response = await fetch('/urls', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json().catch(() => ({}));
        if (!response.ok) {
          throw new Error(data.error || 'Unable to shorten URL');
        }

        shortUrlEl.textContent = data.short_url;
        shortUrlEl.href = data.short_url;
        resultEl.classList.add('visible');
      } catch (err) {
        errorEl.textContent = err.message;
        errorEl.classList.add('visible');
      } finally {
        submitBtn.disabled = false;
      }
    });

    copyBtn.addEventListener('click', async () => {
      await navigator.clipboard.writeText(shortUrlEl.textContent);
      copyBtn.textContent = 'Copied!';
      setTimeout(() => { copyBtn.textContent = 'Copy'; }, 1500);
    });
  </script>
</body>
</html>
